       l'accès automatisé à ces liens), donc gardé tel quel plutôt que d'être deviné. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "AutomotiveBusiness",
    "name": "Cartronic",

    "telephone": "+237690920971",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Yaoundé",
      "addressCountry": "CM"
    },
    "sameAs": [
      "https://www.linkedin.com/company/cartronic-sarl/",
      "https://www.tiktok.com/@cartronic_system",
      "https://www.facebook.com/share/19HAP7J25A/?mibextid=wwXIfr"
    ],
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
